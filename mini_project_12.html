<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Instagram Login • Everyday Moments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 32px 28px 28px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            font-size: 44px;
            font-weight: 600;
            letter-spacing: -1px;
            background: linear-gradient(145deg, #f0f0f0 0%, #ddd 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .tagline {
            text-align: center;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.3;
            color: #b0b0b0;
            margin-bottom: 28px;
            padding: 0 6px;
        }

        .login-heading {
            font-size: 18px;
            font-weight: 600;
            color: #f5f5f5;
            text-align: center;
            margin-bottom: 24px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 13.5px;
            color: #f0f0f0;
            outline: none;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: #888;
            background-color: #3a3a3a;
        }

        .input-field::placeholder {
            color: #aaa;
        }

        /* Yellow login button */
        .login-btn {
            background-color: #ffc107;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 14px;
            color: #1e1e1e;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
        }

        .login-btn:hover {
            background-color: #ffcd38;
            transform: scale(0.98);
        }

        /* White forgot password link */
        .forgot-link {
            text-align: center;
            margin: 6px 0 10px;
        }

        .forgot-link a {
            font-size: 12.5px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
        }

        .forgot-link a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #8e8e8e;
            font-size: 12px;
            font-weight: 500;
            margin: 8px 0 4px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #444;
        }

        .divider::before {
            margin-right: 16px;
        }

        .divider::after {
            margin-left: 16px;
        }

        /* Facebook login row - improved logo */
        .fb-login {
            text-align: center;
            margin: 4px 0 6px;
        }

        .fb-login a {
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            color: #89b4ff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .fb-login a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        /* SVG Facebook icon instead of text "f" */
        .fb-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* New "Log in with Email" button/link */
        .email-login {
            text-align: center;
            margin: 8px 0 4px;
        }

        .email-login a {
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            color: #89b4ff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .email-login a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        .email-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .signup-wrapper {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #333;
        }

        .create-account {
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            color: #ffc107;
            transition: color 0.2s;
        }

        .create-account:hover {
            color: #ffcd38;
            text-decoration: underline;
        }

        .meta-footer {
            text-align: center;
            font-size: 12px;
            color: #8e8e8e;
            margin-top: 18px;
        }

        .meta-footer span {
            font-weight: 500;
            color: #aaa;
        }

        @media (max-width: 450px) {
            .card {
                padding: 24px 20px 26px;
            }
            .logo {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card">
        <div class="logo">Instagram</div>
        <!--<div class="tagline">See everyday moments from your close friends.</div>-->
        <div class="login-heading">Log into Instagram</div>

        <form class="login-form" id="instagramLoginForm">
            <input type="text" class="input-field" id="usernameOrEmail" 
                   placeholder="Mobile number, username or email" autocomplete="username">
            <input type="password" class="input-field" id="password" 
                   placeholder="Password" autocomplete="current-password">
            <button type="submit" class="login-btn">Log in</button>
            <div class="forgot-link">
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
            </div>
            <div class="divider">OR</div>

            <!-- Log in with Facebook - fixed logo with SVG -->
            <div class="fb-login">
                <a href="#" id="facebookLoginLink">
                    <svg class="fb-icon" viewBox="0 0 24 24" width="18" height="18" fill="#1877f2">
                        <!--<path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/>-->
                    </svg>
                    <span>Log in with Facebook</span>
                </a>
            </div>

            <!-- NEW: Log in with Email option -->
            <div class="email-login">
                <a href="#" id="emailLoginLink">
                    <svg class="email-icon" viewBox="0 0 24 24" width="18" height="18" fill="#89b4ff">
                        <!--<path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>-->
                    </svg>
                    <span>Log in with Email</span>
                </a>
            </div>
        </form>

        <div class="signup-wrapper">
            <a href="#" id="createAccountLink" class="create-account">Create new account</a>
        </div>
    </div>
    
</div>

<script>
    (function() {
        const showDemoMessage = (action) => {
            alert(`✨ Demo interface • "${action}" is a front-end example.\nNo actual login or redirection occurs.`);
        };

        const loginForm = document.getElementById('instagramLoginForm');
        const forgotLink = document.getElementById('forgotPasswordLink');
        const facebookLink = document.getElementById('facebookLoginLink');
        const emailLoginLink = document.getElementById('emailLoginLink');
        const createAccountLink = document.getElementById('createAccountLink');
        
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const emailInput = document.getElementById('usernameOrEmail');
                const passInput = document.getElementById('password');
                const emailValue = emailInput ? emailInput.value.trim() : '';
                const passValue = passInput ? passInput.value.trim() : '';
                
                if (emailValue === '' && passValue === '') {
                    showDemoMessage('Log in attempt (empty fields)');
                } else if (emailValue === '') {
                    showDemoMessage('Log in attempt — missing username/email');
                } else if (passValue === '') {
                    showDemoMessage('Log in attempt — missing password');
                } else {
                    showDemoMessage(`Log in as "${emailValue}" (demo mode)`);
                }
            });
        }

        if (forgotLink) {
            forgotLink.addEventListener('click', (e) => {
                e.preventDefault();
                showDemoMessage('Forgot password?');
            });
        }

        if (facebookLink) {
            facebookLink.addEventListener('click', (e) => {
                e.preventDefault();
                showDemoMessage('Log in with Facebook');
            });
        }

        // New handler for "Log in with Email"
        if (emailLoginLink) {
            emailLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                showDemoMessage('Log in with Email');
            });
        }

        if (createAccountLink) {
            createAccountLink.addEventListener('click', (e) => {
                e.preventDefault();
                showDemoMessage('Create new account');
            });
        }
    })();
</script>
</body>
</html>
